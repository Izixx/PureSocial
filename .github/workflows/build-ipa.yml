name: Build PureSocial Unsigned IPA

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA for Sideloadly
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build PureSocial (.app)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project PureSocial.xcodeproj \
            -scheme PureSocial \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find derivedData/Build/Products/Release-iphoneos -name "PureSocial.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r PureSocial.ipa Payload
          echo "PureSocial.ipa created successfully!"
          ls -lh PureSocial.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureSocial-Unsigned-IPA
          path: PureSocial.ipa
          retention-days: 14
